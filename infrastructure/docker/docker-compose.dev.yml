services:
  postgres:
    image: postgres:16-alpine
    container_name: vaultstack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vaultstack
      POSTGRES_PASSWORD: vaultstack_dev
      POSTGRES_DB: vaultstack
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vaultstack -d vaultstack']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vaultstack-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: vaultstack-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vaultstack_minio
      MINIO_ROOT_PASSWORD: vaultstack_minio_secret_change_me
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-24Z
    container_name: vaultstack-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 vaultstack_minio vaultstack_minio_secret_change_me &&
      mc mb --ignore-existing local/vaultstack
      "
    restart: 'no'

volumes:
  postgres_data:
  redis_data:
  minio_data:
