services:
  postgres:
    image: postgres:16-alpine
    container_name: vaultstack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vaultstack
      POSTGRES_PASSWORD: vaultstack_dev
      POSTGRES_DB: vaultstack
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vaultstack -d vaultstack']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vaultstack-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # MINIO IS OPTIONAL.
  #
  # VaultStack's primary storage backend is the local Linux filesystem, and the
  # API runs fully without this service. MinIO exists here only to exercise the
  # S3-compatible provider and the S3 gateway during development.
  #
  # It sits behind a Compose profile so `docker compose up` does not start it by
  # default; that is what keeps it from quietly becoming a hard dependency:
  #
  #   docker compose -f docker-compose.dev.yml up -d                  # no MinIO
  #   docker compose -f docker-compose.dev.yml --profile minio up -d   # with MinIO
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: vaultstack-minio
    profiles: ['minio']
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # Supplied from the developer's own .env; never committed.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vaultstack_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vaultstack_minio_dev_password}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-24Z
    container_name: vaultstack-minio-init
    profiles: ['minio']
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vaultstack_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vaultstack_minio_dev_password}
    # Credentials are passed through the environment rather than inlined, so
    # they stay out of both this file and the container's argument list.
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/vaultstack
      "
    restart: 'no'

volumes:
  postgres_data:
  redis_data:
  # Development object storage for the local filesystem provider. The API
  # currently runs on the host in development and writes to STORAGE_LOCAL_ROOT
  # directly; this volume is the mount target once the API is containerized.
  # In production the root is a real persistent mount, not a container layer.
  vaultstack_storage:
  # MinIO's own data, used only when the `minio` profile is enabled.
  minio_data:
