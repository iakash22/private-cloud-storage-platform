global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/vaultstack-alerts.yml

scrape_configs:
  - job_name: vaultstack-api
    metrics_path: /metrics
    bearer_token_file: /run/secrets/metrics_token
    static_configs:
      - targets:
          - api:3000

  - job_name: vaultstack-node
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: vaultstack-postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: vaultstack-redis
    static_configs:
      - targets:
          - redis-exporter:9121

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
