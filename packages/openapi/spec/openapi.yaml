    get:
      tags: [Audit]
      summary: List audit logs
      operationId: listAuditLogs
      security:
        - sessionCookie: []
        - bearerApiKey: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: userId
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: resourceType
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
        - name: result
          in: query
          schema:
            type: string
            enum: [success, failure]
      responses:
        '200':
          description: Audit log entries
          content:
            application/json:
              schema:
                type: object
                required: [auditLogs]
                properties:
                  auditLogs:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicAuditLog'

