      - $ref: '#/components/parameters/organizationId'
    get:
      tags: [API Keys]
      summary: List service-account S3 credentials
      operationId: listS3Credentials
      security:
        - sessionCookie: []
        - bearerApiKey: []
      responses:
        '200':
          description: Credential metadata and bounded usage counters; secrets are never returned
    post:
      tags: [API Keys]
      summary: Create service-account S3 credential
      operationId: createS3Credential
      security:
        - sessionCookie: []
          csrfHeader: []
        - bearerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateS3CredentialBody'
      responses:
        '201':
          description: Credential created; secretAccessKey is returned once

  /api/v1/organizations/{organizationId}/s3-credentials/service-accounts:
    parameters:
      - $ref: '#/components/parameters/organizationId'
    get:
      tags: [API Keys]
      summary: List service accounts
