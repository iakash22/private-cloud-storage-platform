  /api/v1/organizations/{organizationId}/s3-credentials/service-accounts/{serviceAccountId}:
    parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/serviceAccountId'
    patch:
      tags: [API Keys]
      summary: Enable, disable, or describe a service account
      operationId: updateServiceAccount
      security:
        - sessionCookie: []
          csrfHeader: []
        - bearerApiKey: []
      requestBody:
        required: true
        content:
