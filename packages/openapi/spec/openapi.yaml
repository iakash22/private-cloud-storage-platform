openapi: 3.0.3
info:
  title: VaultStack API
  version: 0.13.0
  description: |
    Self-hosted private cloud storage management platform.

    Business APIs are served under `/api/v1`. Infrastructure probes are at `/health` and `/ready`.

    **Browser clients** use HTTP-only session cookies (`vs_session`, `vs_csrf`). Mutating requests must send `x-csrf-token`.

    **Programmatic clients** may use `Authorization: Bearer <api-key>`.

    **Organization context** for storage routes is resolved server-side from API key membership, the `vs_org` cookie, or `x-vaultstack-organization` header.

    Markdown reference: [docs/api/README.md](../../../docs/api/README.md)
  contact:
    name: VaultStack
  license:
    name: Proprietary

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Health
    description: Liveness and readiness probes
  - name: Auth
    description: Registration, login, sessions, organization selector
  - name: Organizations
    description: Organization CRUD
  - name: Users
    description: Organization user management
  - name: Roles
    description: RBAC roles and assignments
  - name: Teams
    description: Organization teams
  - name: Permissions
    description: Global permission catalog
  - name: API Keys
    description: Hashed automation keys
  - name: Audit
    description: Organization audit logs
  - name: Storage
    description: Buckets, objects, uploads (metadata control plane)
  - name: Storage Transfer
    description: Byte upload/download via scoped tokens
  - name: Sharing
    description: Secure object share links
  - name: S3 Gateway
    description: Inbound S3-compatible API (when enabled)
  - name: Artifacts
    description: CI/CD projects, builds, and artifact versions (bytes via StorageService)
  - name: Backups
    description: Backup jobs, schedules, snapshots, and restore plans (bytes via StorageService)
  - name: Infrastructure
    description: Host, disk, Docker, and storage collectors. No command-execution endpoints.

paths:
  /health:
    get:
      tags: [Health]
      summary: Process liveness
      operationId: getHealth
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /ready:
    get:
      tags: [Health]
      summary: Dependency readiness
      operationId: getReady
      responses:
        '200':
          description: Dependencies healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: One or more dependencies unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'

  /api/v1/health:
    get:
      tags: [Health]
      summary: Process liveness (v1 mirror)
      operationId: getHealthV1
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/ready:
    get:
      tags: [Health]
      summary: Dependency readiness (v1 mirror)
      operationId: getReadyV1
      responses:
        '200':
          description: Dependencies healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register SUPER_ADMIN user and organization
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterBody'
      responses:
        '201':
          description: User and organization created; session cookies set
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Start session
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginBody'
      responses:
        '200':
          description: Session cookies set, or a TOTP challenge when two-factor authentication is enabled
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitedError'

  /api/v1/auth/login/totp:
    post:
      tags: [Auth]
      summary: Complete login with authenticator or backup code
      operationId: verifyTotpLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyTotpLoginBody'
      responses:
        '200':
          description: Session cookies set
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitedError'

  /api/v1/auth/2fa/setup:
    post:
      tags: [Auth]
      summary: Start authenticator enrollment for the current user
      operationId: setupTotp
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: Pending TOTP secret, otpauth URI, and QR SVG
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/v1/auth/2fa/enable:
    post:
      tags: [Auth]
      summary: Confirm authenticator enrollment
      operationId: enableTotp
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnableTotpBody'
      responses:
        '200':
          description: Two-factor authentication enabled; backup codes returned once
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/v1/auth/2fa/disable:
    post:
      tags: [Auth]
      summary: Disable authenticator for the current user
      operationId: disableTotp
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisableTotpBody'
      responses:
        '200':
          description: Two-factor authentication disabled
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke current session
      operationId: logout
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Session revoked

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Current user and memberships
      operationId: getMe
      security:
        - sessionCookie: []
        - bearerApiKey: []
      responses:
        '200':
          description: Authenticated user profile
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/auth/organization:
    post:
