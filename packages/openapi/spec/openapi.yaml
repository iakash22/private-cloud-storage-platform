    get:
      tags: [API Keys]
      summary: List API keys
      operationId: listApiKeys
      security:
        - sessionCookie: []
        - bearerApiKey: []
      responses:
        '200':
          description: API key list (secrets never returned)
    post:
      tags: [API Keys]
      summary: Create API key
      operationId: createApiKey
      security:
        - sessionCookie: []
          csrfHeader: []
        - bearerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyBody'
      responses:
        '201':
          description: API key created; plaintext shown once

  /api/v1/organizations/{organizationId}/api-keys/{apiKeyId}:
    parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/apiKeyId'
    delete:
      tags: [API Keys]
      summary: Revoke API key
      operationId: revokeApiKey
      security:
        - sessionCookie: []
          csrfHeader: []
        - bearerApiKey: []
      responses:
        '204':
