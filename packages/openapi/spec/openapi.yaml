components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: vs_session
      description: HTTP-only session cookie set by login/register
    csrfHeader:
      type: apiKey
      in: header
      name: x-csrf-token
      description: Required on mutating cookie-authenticated requests
    bearerApiKey:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: Organization-scoped automation key
    organizationHeader:
      type: apiKey
      in: header
      name: x-vaultstack-organization
      description: Optional organization selector for multi-org session users

  parameters:
    organizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    roleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
    teamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
    apiKeyId:
      name: apiKeyId
      in: path
      required: true
      schema:
        type: string
    credentialId:
      name: credentialId
      in: path
      required: true
      schema:
        type: string
    serviceAccountId:
      name: serviceAccountId
      in: path
      required: true
      schema:
        type: string
    bucketId:
      name: bucketId
      in: path
      required: true
      schema:
        type: string
    providerId:
      name: providerId
      in: path
      required: true
      schema:
        type: string
    objectId:
      name: objectId
      in: path
      required: true
      schema:
        type: string
    shareId:
      name: shareId
      in: path
      required: true
      schema:
        type: string
    shareToken:
      name: token
      in: path
      required: true
      schema:
        type: string
        description: High-entropy share token; never a sequential id
    uploadId:
      name: uploadId
      in: path
      required: true
      schema:
        type: string
    projectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    buildId:
      name: buildId
      in: path
      required: true
      schema:
        type: string
    artifactVersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
    backupScheduleId:
      name: scheduleId
      in: path
      required: true
      schema:
        type: string
    backupJobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    backupSnapshotId:
      name: snapshotId
      in: path
      required: true
      schema:
        type: string
    backupRestoreId:
      name: restoreId
      in: path
      required: true
      schema:
        type: string

  responses:
    ValidationError:
      description: Request failed Zod validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnauthorizedError:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ForbiddenError:
      description: Authenticated but not permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ConflictError:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimitedError:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    ApiError:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - DEPENDENCY_ERROR
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - RATE_LIMITED
                - INTERNAL_ERROR
                - STORAGE_BUCKET_NOT_FOUND
                - STORAGE_OBJECT_NOT_FOUND
                - STORAGE_ACCESS_DENIED
                - SHARE_ACCESS_DENIED
                - ARTIFACT_PROJECT_NOT_FOUND
                - ARTIFACT_BUILD_NOT_FOUND
                - ARTIFACT_NOT_FOUND
                - ARTIFACT_VERSION_NOT_FOUND
                - ARTIFACT_RELEASE_CONFLICT
                - TOTP_INVALID
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
              description: Per-field validation or dependency messages keyed by JSON body property.
        requestId:
          type: string

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded, error]
        service:
          type: string
        timestamp:
          type: string
          format: date-time
        uptime:
          type: number

    PublicAuditLog:
      type: object
      required:
        - id
        - organizationId
        - userId
        - serviceAccountId
        - actorName
        - action
        - resourceType
        - resourceId
        - result
        - requestId
        - ipAddress
        - metadata
        - createdAt
      properties:
        id:
          type: string
        organizationId:
          type: string
        userId:
          type: string
          nullable: true
        serviceAccountId:
          type: string
          nullable: true
        actorName:
          type: string
          nullable: true
        action:
          type: string
        resourceType:
          type: string
        resourceId:
          type: string
          nullable: true
        result:
          type: string
          enum: [success, failure]
        requestId:
          type: string
          nullable: true
        ipAddress:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    ReadinessResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded, error]
        service:
          type: string
        timestamp:
          type: string
          format: date-time
        checks:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              status:
                type: string
                enum: [ok, degraded, error]
              message:
                type: string

    RegisterBody:
      type: object
      required: [email, password, name, organizationName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
          maxLength: 128
        name:
          type: string
        organizationName:
          type: string

    LoginBody:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    VerifyTotpLoginBody:
      type: object
      required: [challengeToken, code]
      properties:
        challengeToken:
          type: string
        code:
          type: string
          description: 6-digit TOTP code or a one-time backup code

    EnableTotpBody:
      type: object
      required: [code]
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'

    DisableTotpBody:
      type: object
      required: [password, code]
      properties:
        password:
          type: string
        code:
          type: string

    SelectOrganizationBody:
      type: object
      required: [organizationId]
      properties:
        organizationId:
          type: string

    CreateOrganizationBody:
      type: object
      required: [name]
      properties:
        name:
          type: string

    UpdateOrganizationBody:
      type: object
      required: [name]
      properties:
        name:
          type: string

    CreateUserBody:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        name:
          type: string
        roleId:
          type: string

    UpdateUserBody:
      type: object
      properties:
        name:
          type: string
        password:
          type: string
        disabled:
          type: boolean

    CreateTeamBody:
      type: object
      required: [name]
      properties:
        name:
          type: string

    UpdateTeamBody:
      type: object
      required: [name]
      properties:
        name:
          type: string

    CreateShareBody:
      type: object
      required: [visibility]
      properties:
        visibility:
          type: string
          enum: [PRIVATE, TEAM, ORGANIZATION, PUBLIC_LINK]
        teamId:
          type: string
        password:
          type: string
        allowView:
          type: boolean
        allowDownload:
          type: boolean
        maxDownloads:
          type: integer
          minimum: 1
        expiresAt:
          type: string
          format: date-time

    UpdateShareBody:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
          nullable: true
        allowView:
          type: boolean
        allowDownload:
          type: boolean
        maxDownloads:
          type: integer
          nullable: true
        revoked:
          type: boolean
          enum: [true]

    CreateRoleBody:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
          minItems: 1

    AssignRoleBody:
      type: object
      required: [roleId]
      properties:
        roleId:
          type: string

    CreateApiKeyBody:
      type: object
      required: [name]
      properties:
        name:
          type: string
        expiresAt:
          type: string
          format: date-time

    CreateS3CredentialBody:
      type: object
      required: [serviceAccountName, permissions]
      properties:
        serviceAccountName:
          type: string
          minLength: 2
          maxLength: 64
        description:
          type: string
          maxLength: 256
        permissions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ServiceAccountPermission'
        allowedBucketNames:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time

    UpdateS3CredentialBody:
      type: object
      properties:
        permissions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ServiceAccountPermission'
        allowedBucketNames:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
          nullable: true

    UpdateServiceAccountBody:
      type: object
      properties:
        description:
          type: string
          maxLength: 256
          nullable: true
        disabled:
          type: boolean

    ServiceAccountPermission:
      type: string
      enum:
        - storage.read
        - storage.upload
        - storage.delete
        - storage.share
        - artifact.read
        - artifact.upload
        - artifact.delete
        - backup.read
        - backup.create
        - backup.restore
        - backup.delete

    CreateBucketBody:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 63
        region:
          type: string
        versioning:
          type: string
          enum: [UNVERSIONED, ENABLED]
        storageProviderId:
          type: string

    CreateStorageProviderBody:
      type: object
      required: [name, dialect, accessKeyId, secretAccessKey]
      properties:
        name:
          type: string
        dialect:
          type: string
          enum: [AWS_S3, CLOUDFLARE_R2, BACKBLAZE_B2, MINIO, WASABI, DIGITALOCEAN_SPACES, GENERIC]
        endpoint:
          type: string
        region:
          type: string
        bucket:
          type: string
        forcePathStyle:
          type: boolean
        tls:
          type: boolean
        accountId:
          type: string
        accessKeyId:
          type: string
        secretAccessKey:
          type: string
        isDefault:
          type: boolean
        status:
          type: string
          enum: [ACTIVE, DEGRADED, DISABLED]

    UpdateStorageProviderBody:
      type: object
      properties:
        name:
          type: string
        dialect:
          type: string
          enum: [AWS_S3, CLOUDFLARE_R2, BACKBLAZE_B2, MINIO, WASABI, DIGITALOCEAN_SPACES, GENERIC]
        endpoint:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        bucket:
          type: string
          nullable: true
        forcePathStyle:
          type: boolean
          nullable: true
        tls:
          type: boolean
          nullable: true
        accountId:
          type: string
          nullable: true
        accessKeyId:
          type: string
        secretAccessKey:
          type: string
        isDefault:
          type: boolean
        status:
          type: string
          enum: [ACTIVE, DEGRADED, DISABLED]

    UpdateBucketVersioningBody:
      type: object
      required: [versioning]
      properties:
        versioning:
          type: string
          enum: [UNVERSIONED, ENABLED, SUSPENDED]

    CreateLifecyclePolicyBody:
      type: object
      required: [name, days, lifecycleAction]
      properties:
        name:
          type: string
        bucketId:
          type: string
        keyPrefix:
          type: string
        days:
          type: integer
          minimum: 1
        lifecycleAction:
          type: string
          enum:
            - EXPIRE_CURRENT
            - EXPIRE_NONCURRENT
            - ABORT_INCOMPLETE_MULTIPART
            - EXPIRE_TEMPORARY
        enabled:
          type: boolean

    StorageObject:
      type: object
      properties:
        id:
          type: string
        bucketId:
          type: string
        key:
          type: string
        size:
          type: integer
          format: int64
        contentType:
          type: string
        etag:
          type: string
        checksum:
          type: string
        versionId:
          type: string
        isDeleted:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    InitiateUploadBody:
      type: object
      required: [bucketId, key]
      properties:
        bucketId:
          type: string
        key:
          type: string
        contentType:
          type: string
        size:
          type: integer

    CompleteUploadBody:
      type: object
      properties:
        checksumSha256:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'

    ObjectDestinationBody:
      type: object
      required: [destinationBucketId, destinationKey]
      properties:
        destinationBucketId:
          type: string
        destinationKey:
          type: string

    InitiateMultipartBody:
      type: object
      required: [bucketId, key, size]
      properties:
        bucketId:
          type: string
        key:
          type: string
        contentType:
          type: string
        size:
          type: integer
          minimum: 0

    CompleteMultipartBody:
      type: object
      required: [parts]
      properties:
        parts:
          type: array
          minItems: 1
          items:
            type: object
            required: [partNumber, etag]
            properties:
              partNumber:
                type: integer
              etag:
                type: string

    CreateProjectBody:
      type: object
      required: [name]
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        retentionDays:
          type: integer
          nullable: true

    UpdateProjectBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        retentionDays:
          type: integer
          nullable: true

    CreateBuildBody:
      type: object
      properties:
        title:
          type: string
        gitRef:
          type: string
        commitSha:
          type: string
        status:
          type: string
          enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELED]

    InitiateArtifactBody:
      type: object
      required: [name]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [GENERIC, PACKAGE, LOG, ARCHIVE, RELEASE, BUNDLE]
        fileName:
          type: string
        contentType:
          type: string
        size:
          type: integer
        versionLabel:
          type: string

    CompleteArtifactVersionBody:
      type: object
      properties:
        checksumSha256:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'

    ReleaseArtifactVersionBody:
      type: object
      properties:
        releaseTag:
          type: string

    CreateBackupJobBody:
      type: object
      required: [targets]
      properties:
        targets:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              [
                POSTGRESQL,
                MONGODB,
                APP_CONFIG,
                DOCKER_VOLUMES,
                VAULTSTACK_METADATA,
                VAULTSTACK_OBJECT_METADATA,
              ]
        scheduleId:
          type: string

    CreateBackupScheduleBody:
      type: object
      required: [name, targets]
      properties:
        name:
          type: string
        targets:
          type: array
          minItems: 1
          items:
            type: string
        enabled:
          type: boolean
        intervalMinutes:
          type: integer
        retentionDays:
          type: integer
          nullable: true
        retentionCount:
          type: integer
          nullable: true

    UpdateBackupScheduleBody:
      type: object
      properties:
        name:
          type: string
        targets:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        intervalMinutes:
          type: integer
        retentionDays:
          type: integer
          nullable: true
        retentionCount:
          type: integer
          nullable: true

    CreateBackupRestoreBody:
      type: object
      required: [snapshotId]
      properties:
        snapshotId:
          type: string
