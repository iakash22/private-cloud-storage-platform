        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateS3CredentialBody'
      responses:
        '200':
          description: Updated credential metadata; secrets are never returned

  /api/v1/organizations/{organizationId}/s3-credentials/{credentialId}/revoke:
